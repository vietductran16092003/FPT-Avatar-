<style>
:root{
  --orange:#F5760A;
  --orange-deep:#C25A00;
  --blue:#0068B4;
  --blue-deep:#00396B;
  --green:#00A651;
  --ink:#101E2E;
  --ink-soft:#546578;
  --bg:#F7F9FB;
  --surface:#FFFFFF;
  --border:#E1E7EC;
  --border-strong:#C9D3DC;
  --success-bg:#E4F6EC;
  --success-fg:#0E7A3F;
  --warn-bg:#FEF3E6;
  --warn-fg:#B45309;
  --muted-bg:#EEF1F4;
  --muted-fg:#5A6774;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(16,30,46,.06),0 1px 1px rgba(16,30,46,.04);
  --shadow-md:0 10px 28px -10px rgba(16,30,46,.20);
  --shadow-lg:0 26px 54px -18px rgba(16,30,46,.30);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Be Vietnam Pro',-apple-system,'Segoe UI',sans-serif;
  font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
button{font-family:inherit;}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px;border-radius:4px;}
::selection{background:color-mix(in srgb, var(--orange) 28%, transparent);}
button{cursor:pointer;}
.brand-mark{
  background:linear-gradient(135deg,var(--orange),var(--blue) 62%,var(--green));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;letter-spacing:-.01em;flex-shrink:0;
}
.lang-toggle{display:inline-flex;gap:2px;background:var(--muted-bg);border:1px solid var(--border);border-radius:999px;padding:3px;}
.lang-toggle button{border:none;background:transparent;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-soft);transition:background .15s ease,color .15s ease;}
.lang-toggle button.active{background:var(--blue);color:#fff;}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:11px 20px;font-size:14px;font-weight:700;transition:box-shadow .15s ease,transform .1s ease,border-color .15s ease,background .15s ease;white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--orange);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{box-shadow:var(--shadow-md);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:#000;}
.btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--ink);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger-ghost{background:transparent;border-color:var(--border-strong);color:#B4231F;}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;}
.pill-live{background:var(--success-bg);color:var(--success-fg);}
.pill-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success-fg);}
.pill-draft{background:var(--warn-bg);color:var(--warn-fg);}
.pill-archived{background:var(--muted-bg);color:var(--muted-fg);}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:13.5px;background:var(--surface);color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
@media (max-width:820px){
  #admin-shell{grid-template-columns:1fr !important;}
  #admin-shell > div:first-child{
    border-right:none !important;border-bottom:1px solid var(--border);min-height:0 !important;
    display:flex !important;flex-direction:row !important;overflow-x:auto;gap:6px;padding:12px 16px !important;
  }
  #admin-shell > div:first-child > div{white-space:nowrap;}
  #admin-grid-3col{grid-template-columns:1fr !important;}
  .admin-grid-2col{grid-template-columns:1fr !important;}
  #admin-main{padding:20px 18px !important;}
}
@media (max-width:480px){
  body{font-size:14.5px;}
}
</style>

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function t(key){ return T[state.lang][key] ?? key; }
function fmtNum(n){ return n.toLocaleString(state.lang === 'vi' ? 'vi-VN' : 'en-US'); }
function campaignStatus(c){
  const now = new Date(); const s = new Date(c.startDate); const e = new Date(c.endDate); e.setHours(23,59,59,999);
  if (c.status !== 'active') return c.status;
  if (now < s) return 'upcoming';
  if (now > e) return 'closed';
  return 'active';
}
function render(){ document.getElementById('app').innerHTML = renderRoot(); attachHandlers(); }
function go(view, extra){ Object.assign(state, { view }, extra || {}); render(); window.scrollTo({top:0}); }

/* ---------------- Root ---------------- */
function renderRoot(){
  if (state.view === 'login') return renderLogin();
  const chrome = state.view === 'admin' ? renderAdminHeader() : renderUserHeader();
  let body = '';
  if (state.view === 'home') body = renderHome();
  else if (state.view === 'campaign') body = renderCampaign();
  else if (state.view === 'admin') body = renderAdmin();
  return chrome + body + (state.toast ? renderToast() : '');
}

}

/* ---------------- Home ---------------- */

  const cards = campaigns.map(c => {
    const st = campaignStatus(c);
    const statusLabel = st === 'active' ? t('statusActive') : st === 'closed' ? t('statusClosed') : t('statusUpcoming');
    const pillClass = st === 'active' ? 'pill-live' : st === 'closed' ? 'pill-archived' : 'pill-draft';
    const title = state.lang === 'vi' ? c.title : c.titleEn;
    const desc = state.lang === 'vi' ? c.description : c.descriptionEn;
    const cta = state.lang === 'vi' ? c.cta : c.ctaEn;
    return `
    <div class="card" style="overflow:hidden;display:flex;flex-direction:column">
      <div style="aspect-ratio:16/9;position:relative;background:linear-gradient(155deg, color-mix(in srgb, ${esc(FRAME_COLORS[c.templates[0].id]||'#F5760A')} 22%, #eef1f5), #dfe6ee)">
        <div style="position:absolute;top:12px;left:12px;background:#fff" class="pill ${pillClass}">${esc(statusLabel)}</div>
        <div style="position:absolute;top:12px;right:12px;background:var(--orange);color:#fff;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px">${esc(c.badge)}</div>

        <div style="font-size:12px;color:var(--ink-soft);margin:4px 0 12px;font-variant-numeric:tabular-nums">${esc(c.startDate)} – ${esc(c.endDate)}</div>
        <button data-action="open-campaign" data-slug="${esc(c.slug)}" class="btn btn-primary" ${st==='closed'?'disabled':''}>${esc(cta)}</button>
      </div>
    </div>`;
  }).join('');

  return `
  <div style="max-width:1080px;margin:0 auto;padding:56px 32px 80px">
    <div style="margin-bottom:36px">
      <div style="font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px;text-wrap:balance">${esc(t('heroTitle'))}</div>
      <div style="font-size:15px;color:var(--ink-soft)">${esc(t('heroSubtitle'))}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px">${cards}</div>
  </div>`;
}

/* ---------------- Campaign detail ---------------- */
function ensureCampaignDefaults(slug){
  const c = campaigns.find(x => x.slug === slug); if (!c) return;
  if (!state.templateSelections[slug]) state.templateSelections[slug] = c.templates[0].id;
  const tpl = c.templates.find(x => x.id === state.templateSelections[slug]);
  if (!state.overlayValues[slug]) state.overlayValues[slug] = tpl.overlayOptions[0];
}

function renderCampaign(){
  const c = campaigns.find(x => x.slug === state.activeSlug);
  if (!c) return '';
  const st = campaignStatus(c);
  const lang = state.lang;
  const sel = state.templateSelections[c.slug] || c.templates[0].id;
  const tpl = c.templates.find(x => x.id === sel) || c.templates[0];
  const overlayVal = state.overlayValues[c.slug] || tpl.overlayOptions[0];
  const overlayLabel = lang === 'vi' ? tpl.overlayLabel : tpl.overlayLabelEn;
  const photo = state.uploadedPhoto[c.slug];
  const title = lang === 'vi' ? c.title : c.titleEn;
  const frameColor = FRAME_COLORS[tpl.id] || '#F5760A';

  if (st === 'closed') {
    return `<div style="max-width:640px;margin:0 auto;padding:80px 32px;text-align:center">
      <a href="#" data-action="home">${esc(t('backHome'))}</a>
      <div class="card" style="margin-top:24px;padding:40px;">
        <div style="font-size:19px;font-weight:800;margin-bottom:8px">${esc(title)}</div>
        <div style="color:var(--ink-soft)">${esc(t('closedNotice'))}</div>
      </div>
    </div>`;
  }

  const templateOpts = c.templates.map(tp => `
    <div data-action="select-template" data-tpl="${esc(tp.id)}" style="border:2px solid ${tp.id===sel?'var(--orange)':'var(--border)'};border-radius:12px;cursor:pointer;overflow:hidden;aspect-ratio:1/1;background:linear-gradient(155deg, color-mix(in srgb, ${esc(FRAME_COLORS[tp.id]||'#F5760A')} 24%, #eef1f5), #dfe6ee);position:relative;${tp.id===sel?'box-shadow:0 0 0 3px color-mix(in srgb, var(--orange) 18%, transparent)':''}">
      <div style="position:absolute;inset:10%;border-radius:8px;border:6px solid ${esc(FRAME_COLORS[tp.id]||'#F5760A')};box-shadow:inset 0 0 0 2px #fff"></div>
      <div style="position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-soft)">${esc(tp.name)}</div>

  const overlayOpts = tpl.overlayOptions.map(o => `<option value="${esc(o)}" ${o===overlayVal?'selected':''}>${esc(o)}</option>`).join('');

  const dlCount = state.downloadCounts[c.slug] || 0;

  return `
  <div style="max-width:1080px;margin:0 auto;padding:32px 32px 80px">
    <a href="#" data-action="home">${esc(t('backHome'))}</a>
    <div style="display:flex;align-items:center;gap:12px;margin:14px 0 32px;flex-wrap:wrap">
      <div style="background:var(--orange);color:#fff;font-size:12px;font-weight:800;padding:5px 13px;border-radius:999px">${esc(c.badge)}</div>
      <div style="font-size:24px;font-weight:800;letter-spacing:-.01em">${esc(title)}</div>
      <div style="font-size:12.5px;color:var(--ink-soft)">${esc(c.startDate)} – ${esc(c.endDate)}</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start" id="campaign-grid">
      <div style="display:flex;flex-direction:column;gap:32px;min-width:0">
        <div>
          <div style="font-size:15px;font-weight:700;margin-bottom:4px">${esc(t('stepUpload'))}</div>
          <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px">${esc(t('stepUploadHint'))}</div>
          ${photo ? `
            <div style="display:flex;align-items:center;gap:14px">
              <img src="${photo}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--border)" />
              <button data-action="pick-photo" class="btn btn-ghost btn-sm">${esc(t('changePhoto'))}</button>
            </div>` : `
            <div data-action="pick-photo" style="border:2px dashed var(--border-strong);border-radius:14px;padding:30px 18px;text-align:center;cursor:pointer;background:var(--bg)">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.8" width="30" height="30" style="margin:0 auto 8px"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
              <div style="font-weight:700;font-size:13.5px;margin-bottom:2px">${esc(t('dropTitle'))}</div>
              <div style="font-size:12px;color:var(--ink-soft)">${esc(t('dropSub'))}</div>

          <input type="file" id="photo-input" accept="image/png,image/jpeg" class="hidden" />
        </div>

        <div>
          <div style="font-size:15px;font-weight:700;margin-bottom:14px">${esc(t('stepTemplate'))}</div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:320px">${templateOpts}</div>
        </div>

        <div class="field" style="max-width:320px">
          <div style="font-size:15px;font-weight:700;margin-bottom:14px">${esc(t('stepOverlay'))}</div>
          <label for="overlay-select">${esc(overlayLabel)}</label>

        <div style="position:relative;aspect-ratio:1/1;margin-bottom:14px;border-radius:14px;overflow:hidden;background:${photo?`center/cover no-repeat url('${photo}')`:'linear-gradient(155deg,#eef1f5,#dfe6ee)'}">
          <div style="position:absolute;inset:6%;border-radius:12px;border:9px solid ${esc(frameColor)};box-shadow:inset 0 0 0 2px #fff;pointer-events:none"></div>

        </div>
        <div style="font-size:12px;line-height:1.5;color:var(--ink-soft);margin-bottom:18px">${esc(t('previewNote'))}</div>
        <button data-action="download" data-slug="${esc(c.slug)}" class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px">${esc(t('downloadButton'))}</button>
        <div id="download-count" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:16px;font-variant-numeric:tabular-nums">${fmtNum(dlCount)} ${esc(t('downloadCount'))}</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px">${esc(t('shareTitle'))}</div>
        <div style="display:flex;gap:10px">
          <div style="width:36px;height:36px;border-radius:9px;background:var(--muted-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--blue)">FB</div>
          <div style="width:36px;height:36px;border-radius:9px;background:var(--muted-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green)">Zalo</div>
          <div style="width:36px;height:36px;border-radius:9px;background:var(--muted-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-soft)">in</div>
        </div>
      </div>
    </div>
  </div>
  <style>@media (max-width:760px){#campaign-grid{grid-template-columns:1fr !important}}</style>`;

  const maxD = Math.max(...analytics.byDay.map(x=>x.value));

  const activeCount = campaigns.filter(c=>campaignStatus(c)==='active').length;

  return `

  <div id="admin-grid-3col" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px">
    <div class="card" style="padding:20px"><div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px">${esc(t('kpiTotal'))}</div><div style="font-size:28px;font-weight:800;font-variant-numeric:tabular-nums">${fmtNum(total)}</div></div>
    <div class="card" style="padding:20px"><div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px">${esc(t('kpiActive'))}</div><div style="font-size:28px;font-weight:800;font-variant-numeric:tabular-nums">${activeCount}</div></div>
    <div class="card" style="padding:20px"><div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px">${esc(t('kpiTop'))}</div><div style="font-size:17px;font-weight:700;margin-top:6px">${esc(analytics.byCampaign[0].name)}</div></div>
  </div>
  <div class="card" style="padding:22px;margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:16px">${esc(t('byCampaign'))}</div>
    <div style="display:flex;flex-direction:column;gap:12px">${analytics.byCampaign.map(x=>bar(x.name,x.value,maxC,'var(--orange)')).join('')}</div></div>
  <div class="card" style="padding:22px;margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:16px">${esc(t('byUnit'))}</div>
    <div style="display:flex;flex-direction:column;gap:12px">${analytics.byUnit.map(x=>bar(x.name,x.value,maxU,'var(--blue)')).join('')}</div></div>
  <div class="card" style="padding:22px;margin-bottom:20px"><div style="font-size:14px;font-weight:700;margin-bottom:16px">${esc(t('byDay'))}</div>
    <div style="display:flex;align-items:flex-end;gap:10px;height:120px">
      ${analytics.byDay.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
        <div style="width:100%;background:var(--green);border-radius:6px 6px 0 0;height:${Math.round(x.value/maxD*100)}%"></div>
        <div style="font-size:11px;color:var(--ink-soft)">${esc(x.day)}</div>
      </div>`).join('')}
    </div></div>
  <div style="background:var(--warn-bg);border:1px solid #F5D9A8;border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.5;color:var(--warn-fg)">
    ${esc(t('gaNote'))}<span style="font-family:ui-monospace,monospace">avatar_download</span>${esc(t('gaNote2'))}
  </div>`;
}

/* ---------------- Event handlers ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
  const overlaySelect = document.getElementById('overlay-select');
  if (overlaySelect) overlaySelect.addEventListener('change', e => {
    state.overlayValues[state.activeSlug] = e.target.value;
    render();
  });
  const photoInput = document.getElementById('photo-input');
  if (photoInput) photoInput.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { state.uploadedPhoto[state.activeSlug] = ev.target.result; render(); };
    reader.readAsDataURL(file);
  });
  const templateFilter = document.getElementById('template-filter');
  if (templateFilter) templateFilter.addEventListener('change', e => { state.templateFilterSlug = e.target.value; render(); });
}

function readCampaignForm(){
  return {
    slug: val('cf-slug'), language: val('cf-language'), startDate: val('cf-start'), endDate: val('cf-end'),
    status: val('cf-status'), badge: val('cf-badge'), title: val('cf-title'), titleEn: val('cf-titleEn'),
    description: val('cf-description'), descriptionEn: val('cf-descriptionEn'), cta: val('cf-cta'), ctaEn: val('cf-ctaEn'),
  };
}
function readTemplateForm(){
  return {
    name: val('tf-name'),
    photoArea: { x: numVal('tf-x'), y: numVal('tf-y'), w: numVal('tf-w'), h: numVal('tf-h') },
    overlayLabel: val('tf-overlayLabel'), overlayLabelEn: val('tf-overlayLabelEn'),
    overlayOptions: val('tf-overlayOptions').split(',').map(s=>s.trim()).filter(Boolean),
  };
}
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function numVal(id){ return Number(val(id)) || 0; }

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;

  if (state.campaignFormOpen && ['admin-tab','new-campaign','edit-campaign','cycle-status'].includes(action)) {
    state.draftCampaign = readCampaignForm();
  }
  if (state.templateFormOpen && ['admin-tab','new-template','edit-template','delete-template','template-filter'].includes(action)) {
    state.draftTemplate = readTemplateForm();
  }

  switch(action){
    case 'lang': state.lang = el.dataset.lang; render(); break;
    case 'login': go('home'); break;
    case 'home': go('home'); break;
    case 'admin': go('admin'); break;
    case 'open-campaign': {
      const slug = el.dataset.slug;
      ensureCampaignDefaults(slug);
      go('campaign', { activeSlug: slug });
      break;
    }
    case 'pick-photo': document.getElementById('photo-input')?.click(); break;
    case 'select-template': {
      const slug = state.activeSlug;
      const c = campaigns.find(x => x.slug === slug);
      const tpl = c.templates.find(x => x.id === el.dataset.tpl);
      state.templateSelections[slug] = tpl.id;
      state.overlayValues[slug] = tpl.overlayOptions[0];
      render();
      break;
    }
    case 'download': {
      const slug = el.dataset.slug;
      if (!state.uploadedPhoto[slug]) { showToast(t('needPhoto')); break; }
      state.downloadCounts[slug] = (state.downloadCounts[slug]||0) + 1;
      showToast(t('savedToast'));
      render();
      break;
    }
    case 'admin-tab': state.adminTab = el.dataset.tab; state.campaignFormOpen = false; state.templateFormOpen = false; render(); break;
    case 'new-campaign': state.campaignFormOpen = true; state.editingCampaignSlug = null; state.draftCampaign = { language:'vi', status:'draft' }; render(); break;
    case 'edit-campaign': {
      const c = campaigns.find(x => x.slug === el.dataset.slug);
      state.campaignFormOpen = true; state.editingCampaignSlug = c.slug; state.draftCampaign = { ...c }; render();
      break;
    }
    case 'cancel-campaign-form': state.campaignFormOpen = false; render(); break;
    case 'save-campaign': {
      const d = readCampaignForm();
      if (state.editingCampaignSlug) {
        const idx = campaigns.findIndex(x => x.slug === state.editingCampaignSlug);
        campaigns[idx] = { ...campaigns[idx], ...d };
      } else {
        campaigns.push({
          slug: d.slug || 'campaign-' + (campaigns.length+1), status: d.status || 'draft',
          startDate: d.startDate || '2026-01-01', endDate: d.endDate || '2026-12-31',
          title: d.title || 'Campaign mới', titleEn: d.titleEn || d.title || 'New campaign',
          description: d.description || '', descriptionEn: d.descriptionEn || '',
          cta: d.cta || 'Tạo avatar ngay', ctaEn: d.ctaEn || 'Create your avatar', badge: d.badge || 'NEW',
          language: d.language || 'vi', templates: [],
        });
      }
      state.campaignFormOpen = false; showToast(t('savedToast')); render();
      break;
    }
    case 'cycle-status': {
      const order = ['draft','active','archived'];
      const c = campaigns.find(x => x.slug === el.dataset.slug);
      c.status = order[(order.indexOf(c.status)+1) % order.length];
      render();
      break;
    }
    case 'new-template': state.templateFormOpen = true; state.editingTemplateId = null; state.draftTemplate = { photoArea:{x:20,y:20,w:60,h:60}, overlayOptions:[] }; render(); break;
    case 'edit-template': {
      const filterCampaign = campaigns.find(c => c.slug === state.templateFilterSlug) || campaigns[0];
      const tpl = filterCampaign.templates.find(x => x.id === el.dataset.tpl);
      state.templateFormOpen = true; state.editingTemplateId = tpl.id; state.draftTemplate = { ...tpl }; render();
      break;
    }
    case 'delete-template': {
      const filterCampaign = campaigns.find(c => c.slug === state.templateFilterSlug) || campaigns[0];
      filterCampaign.templates = filterCampaign.templates.filter(x => x.id !== el.dataset.tpl);
      render();
      break;
    }
    case 'cancel-template-form': state.templateFormOpen = false; render(); break;
    case 'save-template': {
      const filterCampaign = campaigns.find(c => c.slug === state.templateFilterSlug) || campaigns[0];
      const d = readTemplateForm();
      const newTpl = {
        id: state.editingTemplateId || (filterCampaign.slug + '-' + Date.now()),
        name: d.name || 'Template mới', photoArea: d.photoArea,
        overlayKey: 'field1', overlayLabel: d.overlayLabel || '', overlayLabelEn: d.overlayLabelEn || '',
        overlayOptions: d.overlayOptions.length ? d.overlayOptions : ['—'],
      };
      const idx = filterCampaign.templates.findIndex(x => x.id === state.editingTemplateId);
      if (idx >= 0) filterCampaign.templates[idx] = newTpl; else filterCampaign.templates.push(newTpl);
      state.templateFormOpen = false; showToast(t('savedToast')); render();
      break;
    }
  }
}

function showToast(msg){
  state.toast = msg;
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { state.toast = null; render(); }, 2600);
}

render();
</script>
</body>
</html>
